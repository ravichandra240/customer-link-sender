services:
  - type: web
    name: customer-link-sender
    runtime: python
    plan: starter            # paid plan: always on, and supports a disk
    buildCommand: pip install -r requirements.txt
    # ONE worker only, so the weekend scheduler runs once
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/customers.db
      - key: DRY_RUN
        value: "false"
      - key: WEBSITE_LINK
        value: https://eleganthome.co.in/contact-us/
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
